:root{--ink:#172039;--muted:#6d7489;--line:#e8eaf1;--bg:#f7f8fc;--violet:#4f46e5;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-width:320px}.app{width:min(1180px,calc(100% - 48px));margin:auto;padding:26px 0 56px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:700}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--violet);color:#fff;box-shadow:0 8px 20px #4f46e547}.pill{padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:13px}.dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#38c896}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-top:28px;padding:74px 5% 58px;border-radius:28px;background:radial-gradient(circle at 88% 20%,#dfdeff,transparent 28%),linear-gradient(112deg,#eff0ff,#fbfbff 65%)}.eyebrow{margin:0 0 10px;color:var(--violet);font-size:11px;font-weight:700;letter-spacing:.14em}.hero h1{margin:0;font-size:clamp(35px,5vw,60px);line-height:1.1;letter-spacing:-.06em}.hero p:last-child{margin:20px 0 0;color:var(--muted)}.now-line{margin:0 0 14px;color:var(--muted);font-size:15px;font-weight:600}.now-line b{color:var(--violet)}.hero-side{display:grid;gap:14px;justify-items:stretch}.counter{min-width:150px;padding:20px;border:1px solid #4f46e520;border-radius:20px;background:#ffffffcc;text-align:center;box-shadow:0 18px 50px #23285017}.counter span,.counter small{display:block;color:var(--muted);font-size:12px}.counter b{display:block;color:var(--violet);font-size:40px}.weeknow{min-width:150px;padding:14px 20px;border:1px solid #4f46e520;border-radius:20px;background:#ffffffcc;text-align:center;box-shadow:0 18px 50px #23285017}.weeknow small{display:block;color:var(--muted);font-size:12px}.weeknow b{display:block;color:var(--ink);font-size:20px;line-height:1.3}.filters{display:grid;grid-template-columns:1fr 1.4fr .8fr auto;gap:14px;align-items:end;width:min(1080px,calc(100% - 32px));margin:-26px auto 0;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 18px 50px #23285017;position:relative}.field{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:600}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #dfe2eb;border-radius:11px;background:#fff;color:var(--ink)}button{height:46px;padding:0 18px;border:0;border-radius:11px;background:var(--violet);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}.section{margin-top:70px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.heading h2,.practice h2{margin:0;font-size:25px;letter-spacing:-.04em}.updated{margin:0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:88px repeat(5,1fr);overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}.cell{min-height:113px;padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cell:nth-child(6n){border-right:0}.label{min-height:auto;padding:16px 12px;background:#fcfcfe;color:var(--muted);text-align:center;font-size:13px;font-weight:700}.period{display:grid;place-items:center;background:#fcfcfe;color:var(--muted);text-align:center;font-size:12px;font-weight:700}.course{display:grid;gap:6px;height:100%;padding:11px;border-radius:12px;background:#eeedff}.course:nth-child(2n){background:#e8faf4}.course:nth-child(3n){background:#fff1e5}.meta{display:flex;justify-content:space-between;gap:5px;color:#586075;font-size:10px;font-weight:700}.course h3{margin:0;font-size:13px;line-height:1.35}.course p{margin:0;color:#596176;font-size:11px}.empty{padding-top:32px;color:#b3b8c6;text-align:center;font-size:12px}.mobile{display:none}.mobile-weeknow{display:none}.weather{display:flex;align-items:center;gap:12px;margin-top:22px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(112deg,#eef6ff,#f7fbff 70%);box-shadow:0 8px 26px #23285010}.weather .w-icon{font-size:30px;line-height:1}.weather .w-main{display:grid;gap:3px}.weather .w-city{font-size:12px;color:var(--muted);font-weight:700}.weather .w-now{font-size:15px;font-weight:700}.weather .w-now b{color:var(--violet);font-size:19px}.weather .w-sub{font-size:11px;color:var(--muted)}.weather.w-err{background:#fff7f7}.practice{display:flex;align-items:center;gap:19px;margin-top:26px;padding:24px;border-radius:18px;background:#172039;color:#fff}.practice .eyebrow{color:#a9a5ff}.practice p:last-child{margin:8px 0 0;color:#c6cadd;font-size:14px}.icon{display:grid;place-items:center;flex:0 0 auto;width:47px;height:47px;border-radius:14px;background:#ffffff1a;color:#a9a5ff;font-size:23px}@media(max-width:720px){.app{width:min(100% - 28px,560px);padding-top:16px}.pill{padding:7px 10px;font-size:11px}.hero{margin-top:17px;padding:42px 24px 67px;border-radius:22px}.hero h1{font-size:37px}.hero p:last-child{font-size:14px}.counter,.weeknow{display:none}.mobile-weeknow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:11px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 8px 24px #23285010;font-size:13px}.mobile-weeknow b{color:var(--violet);font-size:15px}.filters{grid-template-columns:1fr;gap:12px;width:calc(100% - 18px);margin-top:-34px;padding:16px}button{width:100%}.section{margin-top:50px}.heading{align-items:start}.updated{padding-top:5px;text-align:right}.grid{display:none}.mobile{display:grid;gap:14px}.day{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff}.dayhead{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fcfcfe;font-size:14px;font-weight:700}.dayhead span{color:var(--muted);font-size:12px;font-weight:500}.daylist{display:grid;gap:10px;padding:12px}.daylist .course{min-height:108px}.weather{margin-top:14px;padding:13px 15px}.weather .w-icon{font-size:26px}.practice{align-items:start;margin-top:16px;padding:20px}.practice h2{font-size:21px}}

<body><main class="app"><header class="top"><div class="brand"><span class="mark">课</span>课表查询</div><div class="pill"><i class="dot"></i><span id="clock">--</span></div></header><section class="hero"><div><p class="eyebrow">CLASS SCHEDULE</p><h1>把一周安排，<br>看得更清楚。</h1><p class="now-line" id="nowLine"></p><p>支持电脑与手机浏览的课程表查询与展示界面。</p></div><div class="hero-side"><div class="weeknow"><small>当前教学周</small><b id="weekNowPc">—</b></div><div class="counter"><span>本周</span><b id="count">0</b><small>个课程时段</small></div></div></section><div class="mobile-weeknow"><span>当前教学周</span><b id="weekNowMobile">—</b></div><section class="filters"><label class="field">班级<input id="class" value="12320309" inputmode="numeric"></label><label class="field">学年学期<select id="term"><option>2026–2027 学年第一学期</option></select></label><label class="field">教学周次<select id="week"></select></label><button id="query">查询课表 →</button></section><section class="section"><div class="heading"><div><p class="eyebrow">WEEKLY VIEW</p><h2 id="title">12320309 班课程表</h2></div><p class="updated" id="note"></p></div><div class="grid" id="grid"></div><div class="mobile" id="mobile"></div><div class="weather" id="weather"><div class="w-icon" id="wIcon">⏳</div><div class="w-main"><span class="w-city">南京 · 江宁区</span><span class="w-now" id="wNow">天气加载中…</span><span class="w-sub" id="wSub"></span></div></div></section><section class="practice"><div class="icon">✦</div><div><p class="eyebrow">PRACTICAL SESSION</p><h2>实践环节</h2><p>第 13–15 周 · 计算机网络项目实践（模拟实践/训练）</p></div></section></main>
<script>
const days=['星期一','星期二','星期三','星期四','星期五'],periods=['1–2 节','3–4 节','5–6 节','7–8 节','9–10 节'];const lessons=[[0,0,'操作系统实现技术','A4N204 · 禄口','耿必鹏','16–17 周'],[1,0,'操作系统实现技术','A4N206 · 禄口','耿必鹏','16–20 周'],[1,0,'编译原理与实现','A4N203 · 禄口','闵芳','2–11 周'],[2,0,'计算机网络原理','A4S504 · 禄口','欧历云','2–11 周'],[3,0,'编译原理与实现','A4N403 · 禄口','闵芳','1–10 周'],[4,0,'操作系统原理','A4S404 · 禄口','罗娇敏','1–12 周'],[0,1,'操作系统原理','A4N308 · 禄口','罗娇敏','2–12 周'],[2,1,'操作系统原理','A4N304 · 禄口','罗娇敏','第 3 周'],[3,1,'操作系统实现技术','A4N205 · 禄口','耿必鹏','16–20 周'],[4,1,'计算机网络原理','A4N403 · 禄口','欧历云','2–11 周'],[1,2,'数据库实现','机房 7 · 禄口','李莹','5–12 周'],[1,3,'数据库实现（上机）','等信息中心安排','李莹','6–12 周'],[1,1,'数据库实现（上机）','等信息中心安排','李莹','第 12 周']];
const $=s=>document.querySelector(s);
/* ---- 动态当前时间 + 自动计算教学周 ---- */
const TERM_START=new Date(2026,8,7); // 2026-09-07（周一）开学，第 1 周 = 9/7–9/13
const weekCn=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function currentWeek(){const now=new Date();const diff=Math.floor((now-TERM_START)/864e5);const w=Math.floor(diff/7)+1;return Math.min(Math.max(w,1),20)}
function tickClock(){const n=new Date();const p=x=>String(x).padStart(2,'0');$('#clock').textContent=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${weekCn[n.getDay()]} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`}
function initNow(){const w=currentWeek();$('#weekNowPc').textContent=`第 ${w} 周`;$('#weekNowMobile').textContent=`第 ${w} 周`;const n=new Date();$('#nowLine').innerHTML=`今天是 <b>${n.getFullYear()} 年 ${n.getMonth()+1} 月 ${n.getDate()} 日</b> · 本学期 <b>第 ${w} 周</b>`;$('#week').value=w;tickClock();setInterval(tickClock,1000)}
/* ---- 江宁区天气（Open-Meteo 免费接口，无需密钥） ---- */
const wmap={0:['☀️','晴'],1:['🌤️','多云间晴'],2:['⛅','多云'],3:['☁️','阴'],45:['🌫️','雾'],48:['🌫️','雾凇'],51:['🌦️','毛毛雨'],53:['🌦️','毛毛雨'],55:['🌦️','毛毛雨'],61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],66:['🌨️','冻雨'],67:['🌨️','冻雨'],71:['🌨️','小雪'],73:['🌨️','中雪'],75:['❄️','大雪'],77:['❄️','雪粒'],80:['🌦️','阵雨'],81:['🌦️','阵雨'],82:['⛈️','强阵雨'],85:['🌨️','阵雪'],86:['🌨️','阵雪'],95:['⛈️','雷阵雨'],96:['⛈️','雷阵雨伴冰雹'],99:['⛈️','雷阵雨伴冰雹']};
async function loadWeather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.95&longitude=118.84&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FShanghai');if(!r.ok)throw 0;const d=await r.json();const c=d.current;const[icon,text]=wmap[c.weather_code]||['🌡️','—'];$('#wIcon').textContent=icon;$('#wNow').innerHTML=`<b>${Math.round(c.temperature_2m)}°C</b> ${text}`;$('#wSub').textContent=`体感 ${Math.round(c.apparent_temperature)}°C · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`}catch(e){$('#wIcon').textContent='⚠️';$('#wNow').textContent='天气获取失败，请检查网络';document.getElementById('weather').classList.add('w-err')}}
/* ---- 课表渲染 ---- */
for(let i=1;i<=20;i++)$('#week').add(new Option(`第 ${i} 周`,i));function active(x,w){const n=x[5].match(/\d+/g).map(Number);return n.length===1?n[0]===w:w>=n[0]&&w<=n[1]}function card(x){return `<article class="course"><div class="meta"><span>${x[5]}</span><span>${periods[x[1]]}</span></div><h3>${x[2]}</h3><p>${x[3]}</p><p>${x[4]}</p></article>`}function render(){let w=+$('#week').value,c=lessons.filter(x=>active(x,w));$('#count').textContent=c.length;$('#title').textContent=($('#class').value.trim()||'未填写班级')+' 班课程表';const n=new Date();$('#note').textContent=`第 ${w} 周 · 数据更新于 ${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')}`;let g='<div class="cell label">节次</div>'+days.map(x=>`<div class="cell label">${x}</div>`).join('');periods.forEach((p,s)=>{g+=`<div class="cell period">${p}</div>`+days.map((_,d)=>{let a=c.filter(x=>x[0]===d&&x[1]===s);return `<div class="cell">${a.map(card).join('')||'<div class="empty">—</div>'}</div>`}).join('')});$('#grid').innerHTML=g;$('#mobile').innerHTML=days.map((d,i)=>{let a=c.filter(x=>x[0]===i);return `<section class="day"><div class="dayhead">${d}<span>${a.length} 个课程时段</span></div><div class="daylist">${a.map(card).join('')||'<div class="empty">当天没有课程</div>'}</div></section>`}).join('')}$('#query').onclick=render;$('#week').onchange=render;$('#class').onkeydown=e=>e.key==='Enter'&&render();initNow();render();loadWeather();
</script></body></html>
