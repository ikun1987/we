ng:42px 24px 67px;border-radius:22px}.hero h1{font-size:37px}.hero p:last-child{font-size:14px}.counter{display:none}.filters{grid-template-columns:1fr;gap:12px;width:calc(100% - 18px);margin-top:-34px;padding:16px}button{width:100%}.section{margin-top:50px}.heading{align-items:start}.updated{padding-top:5px;text-align:right}.grid{display:none}.mobile{display:grid;gap:14px}.day{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff}.dayhead{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fcfcfe;font-size:14px;font-weight:700}.dayhead span{color:var(--muted);font-size:12px;font-weight:500}.daylist{display:grid;gap:10px;padding:12px}.daylist .course{min-height:108px}.practice{align-items:start;margin-top:16px;padding:20px}.practice h2{font-size:21px}}

<body><main class="app"><header class="top"><div class="brand"><span class="mark">课</span>课表查询</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="pill"><i class="dot"></i>2026–2027 · 第一学期</div><div class="pill" id="nowWeek">正在获取当前时间…</div><div class="pill" id="weather">南京江宁 · 天气加载中…</div></div></header><section class="hero"><div><p class="eyebrow">CLASS SCHEDULE</p><h1>把一周安排，<br>看得更清楚。</h1><p>支持电脑与手机浏览的课程表查询与展示界面。</p></div><div class="counter"><span>本周</span><b id="count">0</b><small>个课程时段</small></div></section><section class="filters"><label class="field">班级<input id="class" value="12320309" inputmode="numeric"></label><label class="field">学年学期<select id="term"><option>2026–2027 学年第一学期</option></select></label><label class="field">教学周次<select id="week"></select></label><button id="query">查询课表 →</button></section><section class="section"><div class="heading"><div><p class="eyebrow">WEEKLY VIEW</p><h2 id="title">12320309 班课程表</h2></div><p class="updated" id="note"></p></div><div class="grid" id="grid"></div><div class="mobile" id="mobile"></div></section><section class="practice"><div class="icon">✦</div><div><p class="eyebrow">PRACTICAL SESSION</p><h2>实践环节</h2><p>第 13–15 周 · 计算机网络项目实践（模拟实践/训练）</p></div></section></main>
<script>
const days=['星期一','星期二','星期三','星期四','星期五'],periods=['1–2 节','3–4 节','5–6 节','7–8 节','9–10 节'];const lessons=[[0,0,'操作系统实现技术','A4N204 · 禄口','耿必鹏','16–17 周'],[1,0,'操作系统实现技术','A4N206 · 禄口','耿必鹏','16–20 周'],[1,0,'编译原理与实现','A4N203 · 禄口','闵芳','2–11 周'],[2,0,'计算机网络原理','A4S504 · 禄口','欧历云','2–11 周'],[3,0,'编译原理与实现','A4N403 · 禄口','闵芳','1–10 周'],[4,0,'操作系统原理','A4S404 · 禄口','罗娇敏','1–12 周'],[0,1,'操作系统原理','A4N308 · 禄口','罗娇敏','2–12 周'],[2,1,'操作系统原理','A4N304 · 禄口','罗娇敏','第 3 周'],[3,1,'操作系统实现技术','A4N205 · 禄口','耿必鹏','16–20 周'],[4,1,'计算机网络原理','A4N403 · 禄口','欧历云','2–11 周'],[1,2,'数据库实现','机房 7 · 禄口','李莹','5–12 周'],[1,3,'数据库实现（上机）','等信息中心安排','李莹','6–12 周'],[1,1,'数据库实现（上机）','等信息中心安排','李莹','第 12 周']];
const $=s=>document.querySelector(s);for(let i=1;i<=20;i++)$('#week').add(new Option(`第 ${i} 周`,i));
const TERM_START=new Date('2026-09-07T00:00:00+08:00');
function currentWeek(){return Math.min(20,Math.max(1,Math.floor((Date.now()-TERM_START.getTime())/6048e5)+1))}
{const now=new Date(),cw=currentWeek(),wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];$('#nowWeek').textContent=`今天 ${now.getMonth()+1}月${now.getDate()}日 ${wd} · 第 ${cw} 周`;$('#week').value=cw;}
const WTEXT={0:'晴',1:'大部晴朗',2:'多云',3:'阴',45:'雾',48:'冻雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'小阵雨',81:'阵雨',82:'强阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'雷阵雨伴冰雹'};
fetch('https://api.open-meteo.com/v1/forecast?latitude=31.95&longitude=118.84&current=temperature_2m,weather_code&timezone=Asia%2FShanghai').then(r=>r.json()).then(d=>{const c=d.current||{};$('#weather').textContent=`南京江宁 ${Math.round(c.temperature_2m)}°C ${WTEXT[c.weather_code]||''}`.trim()}).catch(()=>{$('#weather').textContent='南京江宁 · 天气获取失败'});
function active(x,w){const n=x[5].match(/\d+/g).map(Number);return n.length===1?n[0]===w:w>=n[0]&&w<=n[1]}function card(x){return `<article class="course"><div class="meta"><span>${x[5]}</span><span>${periods[x[1]]}</span></div><h3>${x[2]}</h3><p>${x[3]}</p><p>${x[4]}</p></article>`}function render(){let w=+$('#week').value,c=lessons.filter(x=>active(x,w));$('#count').textContent=c.length;$('#title').textContent=($('#class').value.trim()||'未填写班级')+' 班课程表';$('#note').textContent=`第 ${w} 周 · 数据更新于 2026.09.10`;let g='<div class="cell label">节次</div>'+days.map(x=>`<div class="cell label">${x}</div>`).join('');periods.forEach((p,s)=>{g+=`<div class="cell period">${p}</div>`+days.map((_,d)=>{let a=c.filter(x=>x[0]===d&&x[1]===s);return `<div class="cell">${a.map(card).join('')||'<div class="empty">—</div>'}</div>`}).join('')});$('#grid').innerHTML=g;$('#mobile').innerHTML=days.map((d,i)=>{let a=c.filter(x=>x[0]===i);return `<section class="day"><div class="dayhead">${d}<span>${a.length} 个课程时段</span></div><div class="daylist">${a.map(card).join('')||'<div class="empty">当天没有课程</div>'}</div></section>`}).join('')}$('#query').onclick=render;$('#week').onchange=render;$('#class').onkeydown=e=>e.key==='Enter'&&render();render();
</script></body></html>
